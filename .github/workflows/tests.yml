name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No dependencies — engine.js is dependency-free and tests use node:test.
      - name: Run tests
        run: node --test
